<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой парк — лабораторная работа №3</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>

<body>
  <a-scene
    background="color: #E9E5DE"
    renderer="colorManagement: true">

    <a-assets timeout="30000">
      <a-asset-item
        id="park-model"
        src="./park_named.glb">
      </a-asset-item>
    </a-assets>

    <a-entity
      gltf-model="#park-model"
      position="0 0 0"
      rotation="0 0 0"
      scale="1 1 1">
    </a-entity>

    <a-entity
      light="type: ambient; intensity: 0.8">
    </a-entity>

    <a-entity
      light="type: directional; intensity: 1"
      position="-3 5 4">
    </a-entity>

    <a-entity
      camera
      look-controls
      wasd-controls
      position="0 2.3 6"
      rotation="-12 0 0">
    </a-entity>
  </a-scene>

</body>
</html>
